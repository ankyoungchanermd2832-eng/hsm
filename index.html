<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d97b3f" />
    <!-- 휴대폰 홈 화면에 추가했을 때 브라우저 주소창 없이 앱처럼 전체화면으로 열리게 한다 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="수납정리" />
    <title>우리집 수납정리</title>
    <script>
      // 카카오톡 인앱 브라우저(안드로이드)는 앱 설치 기능을 지원하지 않아서, 열리자마자
      // 곧바로 기기의 기본 브라우저로 넘겨서 설치 가능한 화면으로 이어지게 한다.
      // (아이폰은 OS 정책상 자동 전환이 불가능해서 안내 배너로만 유도한다 - InstallBanner.tsx)
      ;(function () {
        try {
          var ua = navigator.userAgent || ''
          var isKakao = /KAKAOTALK/i.test(ua)
          var isAndroid = /Android/i.test(ua)
          if (!isKakao || !isAndroid) return
          if (sessionStorage.getItem('hsm-kakao-escape-tried')) return
          sessionStorage.setItem('hsm-kakao-escape-tried', '1')
          var target = location.href.replace(/^https?:\/\//, '')
          location.href = 'intent://' + target + '#Intent;scheme=https;end'
        } catch {
          // 실패해도 조용히 무시하고 카톡 브라우저 안에서 계속 진행한다 (안내 배너가 대신 안내해준다)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
